name: Build and package

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            release_platform: windows
            rust-target: x86_64-pc-windows-msvc
            artifact: purepan.exe
          - name: Linux x64
            runner: ubuntu-22.04
            release_platform: linux
            rust-target: x86_64-unknown-linux-gnu
            artifact: purepan
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            release_platform: linux
            rust-target: aarch64-unknown-linux-gnu
            artifact: purepan
          - name: macOS Apple Silicon
            runner: macos-latest
            release_platform: mac
            rust-target: aarch64-apple-darwin
            artifact: purepan
          - name: macOS Intel
            runner: macos-latest
            release_platform: mac
            rust-target: x86_64-apple-darwin
            artifact: purepan

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies (GPUI)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig-dev \
            libwayland-dev \
            libxkbcommon-x11-dev \
            libx11-xcb-dev \
            libssl-dev \
            libzstd-dev \
            libvulkan1 \
            mesa-vulkan-drivers

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: ${{ matrix.rust-target }}

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Build PurePan desktop
        shell: bash
        run: cargo build --release --locked -p purepan-desktop --target ${{ matrix.rust-target }}

      - name: Stage artifact
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.rust-target }}/release/${{ matrix.artifact }}" "dist/PurePan-${{ matrix.release_platform }}-${{ matrix.rust-target }}${{ runner.os == 'Windows' && '.exe' || '' }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: PurePan-${{ matrix.release_platform }}-${{ matrix.rust-target }}
          path: dist/*

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}